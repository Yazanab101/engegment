<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Engagement ring favicon: champagne gold + diamond -->
  <defs>
    <linearGradient id="band" x1="10" y1="28" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="45%" stop-color="#D4B56A"/>
      <stop offset="100%" stop-color="#A8893E"/>
    </linearGradient>
    <linearGradient id="diamond" x1="24" y1="8" x2="40" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E8F4FF"/>
      <stop offset="100%" stop-color="#B7D4F0"/>
    </linearGradient>
  </defs>
  <!-- Band -->
  <ellipse cx="32" cy="42" rx="18" ry="12" stroke="url(#band)" stroke-width="5.5" fill="none"/>
  <ellipse cx="32" cy="42" rx="18" ry="12" stroke="#8C7132" stroke-width="1.2" fill="none" opacity="0.35"/>
  <!-- Setting / prongs -->
  <path d="M26 30 L32 22 L38 30 Z" fill="#C9A84A"/>
  <path d="M27.2 29.2 L32 23.6 L36.8 29.2 Z" fill="#E8D090"/>
  <!-- Diamond -->
  <path d="M32 10 L40 22 L32 30 L24 22 Z" fill="url(#diamond)" stroke="#9BB8D4" stroke-width="0.8"/>
  <path d="M32 10 L36.5 22 L32 30 L27.5 22 Z" fill="#FFFFFF" opacity="0.45"/>
  <path d="M24 22 H40" stroke="#A9C4DE" stroke-width="0.7"/>
</svg>
